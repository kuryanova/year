<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогресс года</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #191919;
    color: #e8e6e1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    font-feature-settings: "kern" 1;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  .title {
    font-size: 9px;
    letter-spacing: 0.22em;
    font-weight: 600;
    margin-bottom: 105px;
    color: #e8e6e1;
  }
  .percent-row {
    position: relative;
    height: 64px;
    margin-bottom: 14px;
  }
  .percent-num {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    font-size: 58px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #e8e6e1;
  }
  .bar-container {
    position: relative;
    height: 16px;
    margin-bottom: 12px;
  }
  .bar {
    width: 100%;
    height: 100%;
    background: #2c2c2c;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: #e8e6e1;
    border-radius: 999px 0 0 999px;
    transition: width 1s ease;
  }
  .marker {
    position: absolute;
    top: -7px;
    width: 1.5px;
    height: 30px;
    background: #e8e6e1;
    transform: translateX(-50%);
  }
  .labels {
    position: relative;
    height: 14px;
    font-size: 8px;
    letter-spacing: 0.12em;
    font-weight: 600;
    color: #e8e6e1;
  }
  .label-left { position: absolute; left: 0; }
  .label-right { position: absolute; right: 0; }
  .label-middle {
    position: absolute;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .footer {
    margin-top: 120px;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: #b8b6b1;
  }
  @media (max-width: 480px) {
    body { padding: 28px 16px; }
    .title { margin-bottom: 56px; font-size: 8px; }
    .percent-row { height: 44px; }
    .percent-num { font-size: 38px; }
    .marker { height: 26px; top: -5px; }
    .footer { margin-top: 70px; font-size: 8px; }
    .labels { font-size: 7px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="title" id="title">ПРОГРЕСС 2026 ГОДА</div>

  <div class="percent-row">
    <div class="percent-num" id="percent-num">0%</div>
  </div>

  <div class="bar-container">
    <div class="bar">
      <div class="bar-fill" id="bar-fill"></div>
    </div>
    <div class="marker" id="marker"></div>
  </div>

  <div class="labels">
    <span class="label-left">0%</span>
    <span class="label-middle" id="middle-label">0% ГОДА ПРОШЛО</span>
    <span class="label-right">100%</span>
  </div>

  <div class="footer" id="footer">•</div>
</div>

<script>
(function () {
  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }

  function getDayOfYear(date) {
    var start = new Date(date.getFullYear(), 0, 0);
    var diff = date - start + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000);
    var oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  function ruMonth(m) {
    return ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
            'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'][m];
  }

  function update() {
    var now = new Date();
    var year = now.getFullYear();
    var dayOfYear = getDayOfYear(now);
    var totalDays = isLeapYear(year) ? 366 : 365;
    var fraction = dayOfYear / totalDays;
    var percent = Math.floor(fraction * 100);
    var leftPercent = Math.max(0, Math.min(100, fraction * 100));

    document.getElementById('title').textContent = 'ПРОГРЕСС ' + year + ' ГОДА';

    var pn = document.getElementById('percent-num');
    pn.textContent = percent + '%';
    pn.style.left = leftPercent + '%';

    document.getElementById('bar-fill').style.width = leftPercent + '%';
    document.getElementById('marker').style.left = leftPercent + '%';

    var ml = document.getElementById('middle-label');
    ml.textContent = percent + '% ГОДА ПРОШЛО';
    ml.style.left = leftPercent + '%';

    document.getElementById('footer').textContent =
      '• ' + now.getDate() + ' ' + ruMonth(now.getMonth()) + ' • ' + dayOfYear + '/' + totalDays + ' дней';
  }

  update();
  // Перерасчёт раз в час
  setInterval(update, 60 * 60 * 1000);
})();
</script>
</body>
</html>
